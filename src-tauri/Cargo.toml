[package]
name = "markflow"
version = "0.1.3"
description = "MarkFlow - High-Performance Markdown & Mermaid Workspace"
authors = ["AM Software <contact@amsoftware.com.vn>"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
