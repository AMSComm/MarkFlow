<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Canvas -->
  <rect width="800" height="420" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect y="0" width="800" height="42" rx="12" fill="#0f172a"/>
  <rect y="30" width="800" height="12" fill="#0f172a"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="20" cy="21" r="5" fill="#ef4444"/>
  <circle cx="36" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="21" r="5" fill="#10b981"/>

  <!-- Logo & Title -->
  <text x="80" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Mark<tspan fill="#0ea5e9">Flow</tspan></text>
  <text x="145" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">/ architecture.md</text>

  <!-- View Mode Pill -->
  <rect x="340" y="9" width="120" height="24" rx="6" fill="#1e293b"/>
  <rect x="376" y="11" width="48" height="20" rx="4" fill="#0ea5e9" fill-opacity="0.2"/>
  <text x="382" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Split</text>

  <!-- Left Editor Pane -->
  <rect x="0" y="42" width="395" height="378" fill="#090d16"/>
  <text x="24" y="75" font-family="'JetBrains Mono', monospace" font-size="13" fill="#38bdf8"># 🚀 Architecture Overview</text>
  <text x="24" y="105" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">MarkFlow utilizes a decoupled multi-tab workspace</text>
  <text x="24" y="125" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">with off-thread compilation.</text>
  <text x="24" y="155" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f59e0b">```mermaid</text>
  <text x="24" y="175" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">graph TD</text>
  <text x="24" y="195" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">  Editor[CodeMirror 6] --&gt; Worker</text>
  <text x="24" y="215" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">  Worker --&gt; SVG_Cache[(SHA-256)]</text>
  <text x="24" y="235" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f59e0b">```</text>
  <text x="24" y="275" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">## ⚡ Performance Metric</text>
  <text x="24" y="300" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">- Zero UI blocking during typing</text>
  <text x="24" y="320" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">- Memory footprint: &lt; 35MB</text>

  <!-- Divider -->
  <line x1="395" y1="42" x2="395" y2="420" stroke="#1e293b" stroke-width="2"/>
  <rect x="393" y="220" width="4" height="24" rx="2" fill="#0ea5e9"/>

  <!-- Right Preview Pane -->
  <rect x="395" y="42" width="405" height="378" fill="#0b0f19"/>
  <text x="425" y="76" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">🚀 Architecture Overview</text>
  <line x1="425" y1="88" x2="760" y2="88" stroke="#334155" stroke-width="1"/>
  <text x="425" y="112" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">MarkFlow utilizes a decoupled multi-tab workspace with</text>
  <text x="425" y="130" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">off-thread compilation.</text>
  
  <!-- Mermaid Diagram Node in Preview -->
  <rect x="425" y="150" width="345" height="110" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <rect x="445" y="180" width="90" height="32" rx="6" fill="#1e293b" stroke="#0ea5e9"/>
  <text x="455" y="200" font-family="sans-serif" font-size="10" font-weight="600" fill="#f8fafc">CodeMirror 6</text>
  
  <line x1="535" y1="196" x2="575" y2="196" stroke="#0ea5e9" stroke-width="2"/>
  <polygon points="575,193 581,196 575,199" fill="#0ea5e9"/>
  
  <rect x="585" y="180" width="80" height="32" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="600" y="200" font-family="sans-serif" font-size="10" font-weight="600" fill="#10b981">Worker</text>

  <line x1="665" y1="196" x2="705" y2="196" stroke="#10b981" stroke-width="2"/>
  <polygon points="705,193 711,196 705,199" fill="#10b981"/>

  <rect x="715" y="174" width="45" height="44" rx="10" fill="#1e293b" stroke="#f59e0b"/>
  <text x="720" y="196" font-family="sans-serif" font-size="8" fill="#f59e0b">SHA-256</text>
  <text x="723" y="206" font-family="sans-serif" font-size="7" fill="#cbd5e1">Cache</text>

  <!-- Section Preview Badge -->
  <rect x="425" y="280" width="345" height="60" rx="6" fill="#090d16" stroke="#1e293b"/>
  <rect x="425" y="280" width="345" height="24" fill="#0f172a"/>
  <text x="435" y="296" font-family="sans-serif" font-size="9" font-weight="700" fill="#38bdf8">TYPESCRIPT</text>
  <rect x="720" y="284" width="42" height="16" rx="3" fill="#1e293b"/>
  <text x="728" y="296" font-family="sans-serif" font-size="9" fill="#94a3b8">Copy</text>
  <text x="435" y="322" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">const <tspan fill="#f8fafc">engine</tspan> = <tspan fill="#38bdf8">createWorkspace()</tspan>;</text>
</svg>
