name: Release MarkFlow

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
          run_install: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run code validation & tests
        run: |
          pnpm run lint
          pnpm test
          pnpm run build

      - name: Build Desktop App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MarkFlow ${{ github.ref_name }}'
          releaseBody: |
            ## MarkFlow ${{ github.ref_name }}
            
            ### Highlights
            - 🚀 Zero-lag CodeMirror 6 markdown editing with auto-syntax highlight.
            - 📊 Off-thread Mermaid.js diagram renderer with SHA-256 caching.
            - 🔍 Side Link Inspector for instant anchor section previews.
            - 📋 One-click code block copying & language detection.
            - 🔄 Native file watching & smart conflict resolution.
            - ⚡ Cross-platform desktop binaries (macOS .dmg, Windows .msi/.exe, Linux .deb/.AppImage).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
